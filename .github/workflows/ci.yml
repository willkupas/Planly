# CI do Planly — MANUAL por enquanto (Actions > CI > Run workflow).
# Gatilhos automáticos (pull_request / push) só entram na T-017, ao fim das etapas de teste do app.
name: CI

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Gerar APK debug (flavor dev). Exige o secret GOOGLE_SERVICES_DEV_B64."
        type: boolean
        default: false

# Privilégio mínimo: o CI só lê o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Scan de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Procurar segredos nos arquivos rastreados
        run: bash scripts/check-secrets.sh --all

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Functions (build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Auditar dependências (falha em high/critical)
        run: npm audit --audit-level=high

  android-apk:
    name: APK debug (dev)
    if: ${{ inputs.build_apk }}
    needs: [flutter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restaurar google-services.json do flavor dev (fora do git)
        env:
          GOOGLE_SERVICES_DEV_B64: ${{ secrets.GOOGLE_SERVICES_DEV_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_DEV_B64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_DEV_B64 não configurado (base64 do android/app/src/dev/google-services.json)."
            exit 1
          fi
          mkdir -p android/app/src/dev
          echo "$GOOGLE_SERVICES_DEV_B64" | base64 -d > android/app/src/dev/google-services.json
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
      - uses: actions/upload-artifact@v4
        with:
          name: planly-dev-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
